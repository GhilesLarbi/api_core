services:
    #######################################################
    #######################################################
    db:
        image: postgres:18
        mem_limit: 512m
        env_file: ./backend/.env
        ports:
            - 127.0.0.1:${DB_HOST_PORT:?}:5432
        volumes:
            - postgres_data:/var/lib/postgresql

    #######################################################
    #######################################################
    redis:
        image: redis:8-alpine
        restart: always
        mem_limit: 512m
        env_file: ./backend/.env
        command: >
            sh -c '
            redis-server
            --save 600 1
            --user default off
            --user "$$REDIS_USER" on ">$$REDIS_PASSWORD" "~*" "+@all"
            '
        ports:
            - 127.0.0.1:${REDIS_HOST_PORT:?}:6379
        volumes:
            - redis_data:/data

    #######################################################
    #######################################################
    seaweedfs:
        image: chrislusf/seaweedfs:4.40
        mem_limit: 512m
        env_file: ./backend/.env
        entrypoint: []
        command: >
            sh -c '
            sed
            -e "s|__ACCESS_KEY__|$$AWS_ACCESS_KEY_ID|"
            -e "s|__SECRET_KEY__|$$AWS_SECRET_ACCESS_KEY|"
            /config/s3.template.json > /tmp/s3.json ;
            mkdir -p /data/admin ;
            weed server -s3
            -s3.config=/tmp/s3.json
            -dir=/data
            -ip.bind=0.0.0.0
            -volume.max=0
            -master.volumeSizeLimitMB=1024 &
            weed admin -port=23646
            -master=localhost:9333
            -dataDir=/data/admin &
            until
            echo "fs.configure -locationPrefix=/buckets/temp-fs/ -ttl=1d -apply"
            | weed shell 2>/dev/null | grep -q temp-fs ;
            do sleep 0.5 ; done ;
            echo "s3.bucket.create -name temp-fs" | weed shell ;
            echo "s3.bucket.create -name user" | weed shell ;
            echo "s3.bucket.create -name admin" | weed shell ;
            wait
            '
        ports:
            - 127.0.0.1:${SEAWEEDFS_MASTER_HOST_PORT:?}:9333    # Master UI
            - 127.0.0.1:${SEAWEEDFS_VOLUME_HOST_PORT:?}:9340    # Volume Server
            - 127.0.0.1:${SEAWEEDFS_FILER_HOST_PORT:?}:8888    # Filer UI
            - 127.0.0.1:${SEAWEEDFS_S3_HOST_PORT:?}:8333    # S3 endpoint
            # - 127.0.0.1:${SEAWEEDFS_WEBDAV_HOST_PORT:?}:7333    # WebDAV
            - 127.0.0.1:${SEAWEEDFS_ADMIN_HOST_PORT:?}:23646  # Admin UI
        volumes:
            - seaweedfs_data:/data
            - ./backend/seaweedfs.json:/config/s3.template.json:ro

    #######################################################
    #######################################################
    api:
        build:
            context: ./backend
            target: api
        image: api:latest
        user: "1001:1001"
        mem_limit: 512m
        env_file:
            - ./.env
            - ./backend/.env
        ports:
            - 127.0.0.1:${API_HOST_PORT:?}:8000
        volumes:
            - ./backend:/app
        depends_on:
            - redis
            - db

    #######################################################
    #######################################################
    worker:
        build:
            context: ./backend
            target: worker
        image: worker:latest
        user: "1001:1001"
        mem_limit: 512m
        env_file:
            - ./.env
            - ./backend/.env
        volumes:
            - ./backend:/app
        depends_on:
            - db
            - redis

    #######################################################
    #######################################################
    scheduler:
        build:
            context: ./backend
            target: scheduler
        image: scheduler:latest
        user: "1001:1001"
        mem_limit: 512m
        env_file:
            - ./.env
            - ./backend/.env
        volumes:
            - ./backend:/app
        depends_on:
            - db
            - redis

    #######################################################
    #######################################################
    web-deps:
        build:
            context: ./web
            target: base
        image: web-base:latest
        user: "1001:1001"
        env_file: ./.env
        environment:
            CI: "true"
        command: pnpm install --frozen-lockfile
        restart: "no"
        mem_limit: 1g
        volumes:
            - ./web:/app
            - web_node_modules:/app/node_modules
            - web_admin_node_modules:/app/apps/admin/node_modules
            - web_user_node_modules:/app/apps/user/node_modules
            - web_ui_node_modules:/app/packages/ui/node_modules

    #######################################################
    #######################################################
    web-user:
        build:
            context: ./web
            target: user
        image: web-user:latest
        user: "1001:1001"
        env_file: ./.env
        mem_limit: 1g
        ports:
            - 127.0.0.1:${WEB_USER_HOST_PORT:?}:3000
        volumes:
            - ./web:/app
            - web_node_modules:/app/node_modules
            - web_admin_node_modules:/app/apps/admin/node_modules
            - web_user_node_modules:/app/apps/user/node_modules
            - web_ui_node_modules:/app/packages/ui/node_modules
        depends_on:
            api:
                condition: service_started
            web-deps:
                condition: service_completed_successfully

    #######################################################
    #######################################################
    web-admin:
        build:
            context: ./web
            target: admin
        image: web-admin:latest
        user: "1001:1001"
        env_file: ./.env
        mem_limit: 1g
        ports:
            - 127.0.0.1:${WEB_ADMIN_HOST_PORT:?}:3002
        volumes:
            - ./web:/app
            - web_node_modules:/app/node_modules
            - web_admin_node_modules:/app/apps/admin/node_modules
            - web_user_node_modules:/app/apps/user/node_modules
            - web_ui_node_modules:/app/packages/ui/node_modules
        depends_on:
            api:
                condition: service_started
            web-deps:
                condition: service_completed_successfully

    #######################################################

volumes:
    postgres_data:
    redis_data:
    seaweedfs_data:
    # Shared by web-deps and both dev servers: one install, one tree.
    web_node_modules:
    web_admin_node_modules:
    web_user_node_modules:
    web_ui_node_modules:
